name: Release
description: Zip the steamrt3, steamrt4, windows and symbol artifacts, plus any extra ones, into a GitHub release.

inputs:
  artifact:
    description: Name prefix of the artifacts the build actions uploaded.
    required: true
  extra:
    description: Further artifacts, space separated, each released as <name>-<tag>.zip.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Create archives
      shell: bash
      env:
        ARTIFACT: ${{ inputs.artifact }}
        EXTRA: ${{ inputs.extra }}
        TAG: ${{ github.ref_name }}
      run: bash "${{ github.action_path }}/archive.sh"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: release/*.zip
        generate_release_notes: true
